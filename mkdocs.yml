site_name: angular-django2
site_description: Angular CLI schematics collection for Django-friendly Angular workspaces
site_url: https://angular-django2.readthedocs.io/
repo_url: https://github.com/shlomoa/angular-django2
repo_name: shlomoa/angular-django2
edit_uri: edit/main/docs/

docs_dir: docs

exclude_docs: |
  REQUIREMENTS.md
  INTEGRATION_TESTING.md
  RELEASING.md

nav:
  - Start here:
      - Choose a journey: index.md
      - Create a complete Material application: TUTORIAL.md
  - Set up a workspace:
      - Install and register: cli/ng-add.md
      - Bootstrap an empty workspace: cli/workspace-setup.md
      - Generate an application: cli/application.md
      - Create a complete Material application: cli/material-app.md
      - Configure Angular Material: cli/material-setup.md
      - Create a project structure: cli/project-structure.md
  - Generate application features:
      - Components:
          - Component: cli/component.md
          - Embed a component: cli/embed-component.md
          - Complex component: cli/complex-component.md
      - Forms:
          - Field component: cli/field-component.md
          - Form field: cli/form-field.md
          - Reactive form: cli/reactive-form.md
      - Pages and sites:
          - Page: cli/page.md
          - Site: cli/site.md
  - Integrate and extend:
      - OpenAPI setup: cli/openapi-setup.md
      - Data service: cli/data-service.md
      - Service: cli/service.md
      - Class: cli/class.md
      - App shell: cli/app-shell.md
  - CLI reference:
      - Overview: cli/index.md

theme:
  name: material
  palette:
    scheme: default
    primary: deep purple
    accent: indigo

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true
