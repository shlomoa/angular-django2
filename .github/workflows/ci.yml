name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install documentation dependencies
        run: python -m pip install --requirement docs/requirements.txt

      - name: Build documentation
        run: npm run docs:build

  validate:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The root manifest links the local openui-spec build at ../openui-spec/dist/openui-spec
      - name: Build openui-spec
        shell: bash
        run: |
          git clone --depth 1 https://github.com/shlomoa/openui-spec.git ../openui-spec
          npm ci --prefix ../openui-spec
          npm run build --prefix ../openui-spec

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run lint
        run: npm run lint

      - name: Build package
        run: npm run build

      - name: Run tests
        run: npm run test:ci

      # E2E tests are skipped in CI by default due to long execution time (5+ minutes)
      # To enable, uncomment the following step or run manually with: npm run test:e2e
      # - name: Run E2E tests
      #   run: npm run test:e2e

      - name: Verify npm package tarball
        run: npm pack ./projects/angular-django2/dist --dry-run

      - name: Verify tracked files are unchanged
        run: git diff --exit-code
