name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      npm-tag:
        description: npm dist-tag to publish under
        required: true
        default: latest

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # The root manifest links the local openui-spec build at ../openui-spec/dist/openui-spec
      - name: Build openui-spec
        run: |
          git clone --depth 1 https://github.com/shlomoa/openui-spec.git ../openui-spec
          npm ci --prefix ../openui-spec
          npm run build --prefix ../openui-spec

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Build package
        run: npm run build

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test:ci

      - name: Publish package
        run: npm publish ./projects/angular-django2/dist --access public --tag "${{ inputs.npm-tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify tracked files are unchanged
        run: git diff --exit-code
